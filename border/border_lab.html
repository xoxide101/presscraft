<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Border designer</title>
<style>
  :root { --ink: #1d2330; --muted: #6f7890; --line: #dfe3ea; --bg: #e7eaf0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; height: 100vh; display: grid; grid-template-columns: 330px 1fr 292px; }
  .opts { background: #fff; border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; padding: 12px 14px 24px; }
  .opts h1 { font-size: 15px; margin: 0 0 2px; }
  .opts .note { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 8px 0 0; padding: 8px 0 0; }
  legend { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 4px 0 0; }
  label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  label > span:first-child { min-width: 96px; color: #4b5366; }
  select, input[type=number] { flex: 1; min-width: 0; font: inherit; padding: 3px 6px; border: 1px solid #c9cedb; border-radius: 6px; background: #fff; }
  input[type=range] { flex: 1; }
  input[type=color] { width: 38px; height: 26px; padding: 0 2px; border: 1px solid #c9cedb; border-radius: 6px; }
  .row2 { display: flex; gap: 8px; }
  .row2 > label { flex: 1; }
  .val { min-width: 30px; text-align: right; color: var(--muted); font-size: 11px; }
  .btn { font: inherit; padding: 5px 10px; border: 1px solid #c9cedb; border-radius: 6px; background: #fff; cursor: pointer; }
  .btn.primary { background: #2453c7; border-color: #2453c7; color: #fff; font-weight: 600; }
  .view { overflow: auto; display: flex; align-items: center; justify-content: center; padding: 22px; }
  .paper { background: #fff; box-shadow: 0 3px 16px rgba(0, 0, 0, .22); flex: none; }
  .paper svg { display: block; width: 100%; height: 100%; }
  .gallery { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; }
  .gallery button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 3px; cursor: pointer; line-height: 0; }
  .gallery button[aria-pressed="true"] { border-color: #2453c7; box-shadow: 0 0 0 2px #2453c7 inset; }
  .gallery svg { width: 100%; height: auto; }
  .tiny { font-size: 10px; color: var(--muted); }
  /* the picture picker: drag a picture onto the page, the strip, or a picture box */
  .pick { background: #fff; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .pick .hd { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
  .pick h2 { font-size: 15px; margin: 0 0 2px; }
  .pick input[type=search] { flex: 1; min-width: 0; font: inherit; padding: 4px 8px; border: 1px solid #c9cedb; border-radius: 6px; }
  .pick .grid { flex: 1; overflow-y: auto; padding: 6px 10px 10px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-content: start; }
  .grp { grid-column: 1 / -1; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 0; }
  .tile { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 3px; cursor: grab; line-height: 0; touch-action: none; user-select: none; }
  .tile:hover { border-color: #9db3e8; background: #f4f7fe; }
  .tile[aria-pressed="true"] { border-color: #2453c7; box-shadow: 0 0 0 2px #2453c7 inset; }
  .tile svg, .chip svg, .ghost svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .strip { min-height: 44px; border: 1.5px dashed #b9c3d8; border-radius: 8px; padding: 4px; display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start; margin-top: 4px; }
  .strip.hot { border-color: #2453c7; background: #eef3fe; }
  .strip .empty { color: var(--muted); font-size: 11px; padding: 6px; pointer-events: none; }
  .chip { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: #fff; cursor: grab; touch-action: none; position: relative; user-select: none; }
  .chip.ins { box-shadow: -3px 0 0 #2453c7; }
  .chip.end { box-shadow: 3px 0 0 #2453c7; }
  .chip.going { opacity: .35; }
  .chip .x { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%; background: #1d2330; color: #fff; font: 700 10px/14px system-ui; text-align: center; cursor: pointer; display: none; }
  .chip:hover .x { display: block; }
  .ghost { position: fixed; left: 0; top: 0; width: 52px; height: 52px; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .3)); }
  .ghost.bin { opacity: .35; }
  label.slot.hot { background: #eef3fe; outline: 1.5px dashed #2453c7; border-radius: 6px; }
  #foot .tiny { margin-bottom: 2px; }
  #foot .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  #foot .btn { padding: 3px 8px; font-size: 12px; }
  .paper { touch-action: none; }
  /* the 16 spots, laid out like the page: drop a picture on one to put it there */
  .map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin: 6px 0 2px; }
  .spot { position: relative; aspect-ratio: 1; border: 1.5px dashed #c3cbdb; border-radius: 7px; background: #fbfcfe; cursor: pointer; touch-action: none; user-select: none; padding: 3px; }
  .spot svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .spot .lb { position: absolute; left: 2px; bottom: 1px; font: 700 9px/1 system-ui; color: #6f7890; background: rgba(255, 255, 255, .85); border-radius: 3px; padding: 1px 2px; pointer-events: none; }
  .spot.c { border-color: #e5345a; } .spot.m { border-color: #2453c7; } .spot.o { border-color: #2e9e48; }
  .spot.own { border-style: solid; background: #fff; }
  .spot.kind svg { opacity: .55; }
  .spot.hot, .spot.chosen { box-shadow: 0 0 0 2px #2453c7; background: #eef3fe; }
  .spot .x { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%; background: #1d2330; color: #fff; font: 700 10px/14px system-ui; text-align: center; cursor: pointer; display: none; }
  .spot:hover .x { display: block; }
  .mapmid { grid-column: 2 / 5; grid-row: 2 / 5; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 2px 4px; font-size: 10.5px; color: #4b5366; text-align: center; }
  .mapmid .row { display: flex; gap: 4px; justify-content: center; }
  .mapmid .btn { padding: 3px 9px; font-size: 12px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  /* the little tab box: Spots, Flowing along, Placed */
  .tabs { display: flex; gap: 2px; margin-top: 6px; border-bottom: 1px solid #c9cedb; }
  .tab { font: 600 12px system-ui; padding: 5px 9px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: none; color: #4b5366; cursor: pointer; margin-bottom: -1px; }
  .tab:hover { background: #f1f4fa; }
  .tab[aria-selected="true"] { background: #fff; border-color: #c9cedb; color: #1d2330; }
  /* tabs, one look with ShiftCraft's: each its own colour on the top edge (blue, teal, violet, amber, rose, green, orange) */
  .tab { --tab-hue: #3e63dd; box-shadow: inset 0 3px 0 color-mix(in srgb, var(--tab-hue) 35%, transparent); }
  .tab:nth-of-type(7n+2) { --tab-hue: #12a594; } .tab:nth-of-type(7n+3) { --tab-hue: #8e4ec6; } .tab:nth-of-type(7n+4) { --tab-hue: #e5a00d; }
  .tab:nth-of-type(7n+5) { --tab-hue: #e5484d; } .tab:nth-of-type(7n+6) { --tab-hue: #46a758; } .tab:nth-of-type(7n+7) { --tab-hue: #f76b15; }
  .tab:hover { background: color-mix(in srgb, var(--tab-hue) 9%, #fff); }
  .tab[aria-selected="true"] { box-shadow: inset 0 3px 0 var(--tab-hue); background: color-mix(in srgb, var(--tab-hue) 6%, #fff); }
  .tabbox { border: 1px solid #c9cedb; border-top: 0; border-radius: 0 0 8px 8px; padding: 6px 8px 8px; }
  .pane { display: none; } .pane.on { display: block; }
  .find { display: flex; align-items: center; gap: 6px; margin-top: 8px; border: 1.5px solid #9db3e8; border-radius: 8px; padding: 2px 8px; background: #fff; }
  .find:focus-within { border-color: #2453c7; box-shadow: 0 0 0 2px rgba(36, 83, 199, .15); }
  .find svg { flex: none; }
  .find input[type=search] { border: 0; padding: 5px 0; outline: none; }
  .found { font-size: 10.5px; color: var(--muted); margin: 2px 0 0 2px; }
  .fitnote { font-size: 11px; color: #2453c7; margin: 4px 0 0; min-height: 0; }
  .fitnote.warn { color: #b3261e; }
  .dbar .row { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0 4px; }
  .dbar .btn { padding: 3px 8px; font-size: 12px; }
  .dbar .btn.primary { margin: 2px 0 4px; }
  .dbar .useprint { font-weight: 600; }
  #otbox label > span:first-child { min-width: 112px; flex: none; white-space: nowrap; }
  #otbox input[type=range] { min-width: 0; }
  #foot label > span:first-child { min-width: 40px; }
  #foot input[type=range] { min-width: 0; }
  /* the left panel: theme on top, tabs, the settings, Save at the foot */
  .opts { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .otop { padding: 12px 14px 0; }
  .opts .tabs { margin: 8px 14px 0; }
  .otbox { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 14px; border: 1px solid #c9cedb; border-top: 0; border-radius: 0 0 8px 8px; padding: 6px 10px 10px; }
  .ofoot { padding: 8px 14px 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .ofoot .dpi { display: flex; gap: 6px; align-items: center; flex: 1 1 100%; }
  .ofoot .dpi > span { min-width: 0 !important; }
  .ofoot .note { flex: 1 1 100%; min-height: 1em; }
  .sub { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; border-top: 1px solid var(--line); padding-top: 6px; }
  .sub:first-child { border-top: 0; margin-top: 2px; padding-top: 0; }
  .rs { visibility: hidden; border: 0; background: none; color: #2453c7; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; flex: none; }
  label.chg .rs { visibility: visible; }
  label.chg > span:first-child { color: #2453c7; font-weight: 600; }
  /* menus */
  .menu { position: fixed; z-index: 70; background: #fff; border: 1px solid #c9cedb; border-radius: 8px; box-shadow: 0 6px 22px rgba(0, 0, 0, .18); padding: 4px; min-width: 210px; max-width: 320px; font-size: 12.5px; }
  .menu .it { padding: 5px 10px; border-radius: 5px; cursor: pointer; outline: none; }
  .menu .it:hover, .menu .it:focus { background: #eef3fe; }
  .menu .it.dis { color: #a7adbb; cursor: default; background: none; }
  .menu .mh { font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 4px 10px 3px; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px; }
</style>
</head>
<body>
<div class="opts" id="opts"></div>
<div class="view" id="view"><div class="paper" id="paper"></div></div>
<div class="pick" id="pick"></div>
<script src="border_icons.js"></script>
<script src="border_icons2.js"></script>
